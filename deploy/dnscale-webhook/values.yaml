groupName: acme.dnscale.eu

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

image:
  repository: ghcr.io/dnscaleou/cert-manager-webhook-dnscale
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

# Preserve resource names and selectors used by the original source chart.
nameOverride: "dnscale-webhook"
fullnameOverride: ""

# Each entry grants read access only to the named credential Secrets.
# An empty namespace uses certManager.namespace (the default ClusterIssuer
# resource namespace). Add an entry for each namespace using an Issuer.
secretAccess:
  - namespace: ""
    secretNames:
      - dnscale-api-token

service:
  type: ClusterIP
  port: 443

securePort: 8443

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
