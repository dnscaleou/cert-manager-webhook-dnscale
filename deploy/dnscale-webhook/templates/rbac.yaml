apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dnscale-webhook.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dnscale-webhook.fullname" . }}:webhook-authentication-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "dnscale-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dnscale-webhook.fullname" . }}:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "dnscale-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dnscale-webhook.fullname" . }}:domain-solver
rules:
  - apiGroups:
      - {{ .Values.groupName }}
    resources:
      - '*'
    verbs:
      - 'create'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dnscale-webhook.fullname" . }}:domain-solver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dnscale-webhook.fullname" . }}:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ .Values.certManager.serviceAccountName }}
    namespace: {{ .Values.certManager.namespace }}
{{- range $index, $access := .Values.secretAccess }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dnscale-webhook.fullname" $ }}:credentials-{{ $index }}
  namespace: {{ default $.Values.certManager.namespace $access.namespace | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
{{ toYaml (required "secretAccess entries require secretNames" $access.secretNames) | indent 6 }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dnscale-webhook.fullname" $ }}:credentials-{{ $index }}
  namespace: {{ default $.Values.certManager.namespace $access.namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dnscale-webhook.fullname" $ }}:credentials-{{ $index }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dnscale-webhook.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
