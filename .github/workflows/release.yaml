name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/dnscaleou/cert-manager-webhook-dnscale
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Check release versions and existing releases
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          helm show chart deploy/dnscale-webhook | grep -Fx "version: ${RELEASE_TAG#v}"
          helm show chart deploy/dnscale-webhook | grep -Fx "appVersion: $RELEASE_TAG"
          helm template dnscale deploy/dnscale-webhook --show-only templates/deployment.yaml \
            | grep -F "image: \"$IMAGE:$RELEASE_TAG\""
          # A retry may repair a draft, but must never overwrite a public release.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > /tmp/published-tags
          if grep -Fxq "$RELEASE_TAG" /tmp/published-tags; then
            echo 'This version is already released; create a new version instead.'
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/dnscaleou/cert-manager-webhook-dnscale:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/dnscaleou/cert-manager-webhook-dnscale
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish OCI chart and prepare release assets
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mkdir -p dist
          helm package deploy/dnscale-webhook --destination dist
          helm push "dist/cert-manager-webhook-dnscale-${RELEASE_TAG#v}.tgz" oci://ghcr.io/dnscaleou/charts
          (cd dist && sha256sum ./*.tgz > SHA256SUMS)
      - name: Create or refresh draft release
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cat > dist/release-notes.md <<EOF
          DNScale DNS-01 webhook for cert-manager: apex and wildcard certificates,
          namespaced Issuers and ClusterIssuers, scoped Secret access, and selective TXT cleanup.

          Image (Linux AMD64 and ARM64): \`$IMAGE:$RELEASE_TAG\`

          Immutable image digest: \`$IMAGE@$IMAGE_DIGEST\`

          Install with cert-manager already running:

          \`\`\`sh
          helm install cert-manager-webhook-dnscale oci://ghcr.io/dnscaleou/charts/cert-manager-webhook-dnscale --version ${RELEASE_TAG#v} --namespace cert-manager --set fullnameOverride=cert-manager-webhook-dnscale --wait --timeout 180s
          \`\`\`

          The chart archive and SHA256SUMS are also attached below.
          See the [README](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/README.md)
          for credentials and staging issuance. Tested with Kubernetes 1.35.0 and cert-manager 1.19.3.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file dist/release-notes.md
            gh release upload "$RELEASE_TAG" dist/*.tgz dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tgz dist/SHA256SUMS \
              --verify-tag --draft --title "DNScale cert-manager webhook $RELEASE_TAG" \
              --notes-file dist/release-notes.md
          fi

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Check anonymous access and release checksums
        run: |
          # No registry login in this job: customers must be able to pull anonymously.
          python3 scripts/verify-release.py "$RELEASE_TAG" "$IMAGE_DIGEST"
          mkdir -p dist oci
          gh release download "$RELEASE_TAG" --pattern '*.tgz' --pattern SHA256SUMS --dir dist
          (cd dist && sha256sum --check SHA256SUMS)
          helm pull oci://ghcr.io/dnscaleou/charts/cert-manager-webhook-dnscale \
            --version "${RELEASE_TAG#v}" --destination oci
          cmp "dist/cert-manager-webhook-dnscale-${RELEASE_TAG#v}.tgz" \
            "oci/cert-manager-webhook-dnscale-${RELEASE_TAG#v}.tgz"
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.35.0
          kubectl_version: v1.35.0
          cluster_name: release
      - name: Install published chart and image
        run: |
          helm install cert-manager https://charts.jetstack.io/charts/cert-manager-v1.19.3.tgz \
            --namespace cert-manager --create-namespace --set crds.enabled=true --wait --timeout 180s
          helm install cert-manager-webhook-dnscale oci://ghcr.io/dnscaleou/charts/cert-manager-webhook-dnscale \
            --version "${RELEASE_TAG#v}" --namespace cert-manager \
            --set fullnameOverride=cert-manager-webhook-dnscale --wait --timeout 180s
          kubectl wait apiservice/v1alpha1.acme.dnscale.eu --for=condition=Available --timeout=60s
          test "$(kubectl auth can-i get secret/dnscale-api-token -n cert-manager \
            --as system:serviceaccount:cert-manager:cert-manager-webhook-dnscale)" = yes
          if kubectl auth can-i get secret/unrelated -n cert-manager \
            --as system:serviceaccount:cert-manager:cert-manager-webhook-dnscale; then
            echo 'Webhook must not read unrelated Secrets'
            exit 1
          fi
      - name: Publish verified release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Show cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,certificates -n cert-manager || true
          kubectl describe apiservice v1alpha1.acme.dnscale.eu || true
          kubectl logs -n cert-manager deployment/cert-manager-webhook-dnscale --tail=100 || true
